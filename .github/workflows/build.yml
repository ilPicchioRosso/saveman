name: Build saveman.nro

on:
  push:
  pull_request:
  workflow_dispatch:   # permette di lanciarla a mano dalla scheda Actions

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa le librerie
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed switch-dev switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl switch-zlib switch-mbedtls

      - name: Compila
        run: |
          export PATH="$PATH:/opt/devkitpro/portlibs/switch/bin"
          make

      - name: Prepara il pacchetto per la microSD
        run: |
          mkdir -p dist/switch
          cp saveman.nro dist/switch/
          cp -r sd_card/switch/saveman dist/switch/

      - uses: actions/upload-artifact@v4
        with:
          name: saveman-sd-card
          path: dist
